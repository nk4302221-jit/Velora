<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-label="Modern smartwatch showing health and fitness tracking">
  <defs>
    <radialGradient id="wbg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#1f4d6e"/>
      <stop offset="52%" stop-color="#11233a"/>
      <stop offset="100%" stop-color="#070d18"/>
    </radialGradient>
    <radialGradient id="wspot" cx="50%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wband" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3a52"/>
      <stop offset="100%" stop-color="#0d1626"/>
    </linearGradient>
    <linearGradient id="wcase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a9b7cc"/>
      <stop offset="45%" stop-color="#dfe7f2"/>
      <stop offset="100%" stop-color="#7f8ea6"/>
    </linearGradient>
    <linearGradient id="wscreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1420"/>
      <stop offset="100%" stop-color="#05090f"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="ring3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="750" fill="url(#wbg)"/>
  <rect width="1000" height="750" fill="url(#wspot)"/>
  <ellipse cx="500" cy="648" rx="220" ry="30" fill="#000000" opacity="0.5"/>

  <!-- bands -->
  <path d="M430 60 h140 q26 0 26 26 v150 h-192 v-150 q0 -26 26 -26 z" fill="url(#wband)"/>
  <path d="M404 514 h192 v150 q0 26 -26 26 h-140 q-26 0 -26 -26 z" fill="url(#wband)"/>
  <g stroke="#0a1120" stroke-width="3" opacity="0.55">
    <line x1="424" y1="96" x2="576" y2="96"/>
    <line x1="424" y1="140" x2="576" y2="140"/>
    <line x1="424" y1="184" x2="576" y2="184"/>
    <line x1="424" y1="566" x2="576" y2="566"/>
    <line x1="424" y1="610" x2="576" y2="610"/>
  </g>

  <!-- case -->
  <rect x="356" y="204" width="288" height="342" rx="72" fill="url(#wcase)"/>
  <rect x="356" y="204" width="288" height="342" rx="72" fill="none" stroke="#5b6b82" stroke-width="2" opacity="0.7"/>
  <!-- crown -->
  <rect x="644" y="322" width="26" height="58" rx="12" fill="url(#wcase)"/>
  <rect x="646" y="330" width="22" height="8" rx="4" fill="#94a3b8" opacity="0.8"/>
  <rect x="646" y="344" width="22" height="8" rx="4" fill="#94a3b8" opacity="0.8"/>
  <rect x="646" y="358" width="22" height="8" rx="4" fill="#94a3b8" opacity="0.8"/>
  <!-- side button -->
  <rect x="644" y="404" width="20" height="44" rx="10" fill="#9fb0c6"/>

  <!-- screen -->
  <rect x="380" y="228" width="240" height="294" rx="52" fill="url(#wscreen)"/>
  <!-- time -->
  <text x="500" y="316" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="70" font-weight="700" fill="#f8fafc">10:09</text>
  <text x="500" y="346" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#7dd3fc" letter-spacing="2">TUE 14</text>

  <!-- activity rings -->
  <g transform="translate(500 432)" fill="none" stroke-linecap="round">
    <circle r="46" stroke="#132334" stroke-width="13"/>
    <circle r="46" stroke="url(#ring1)" stroke-width="13" stroke-dasharray="230 289" transform="rotate(-90)"/>
    <circle r="31" stroke="#132334" stroke-width="13"/>
    <circle r="31" stroke="url(#ring2)" stroke-width="13" stroke-dasharray="160 195" transform="rotate(-90)"/>
    <circle r="16" stroke="#132334" stroke-width="13"/>
    <circle r="16" stroke="url(#ring3)" stroke-width="13" stroke-dasharray="80 101" transform="rotate(-90)"/>
  </g>

  <!-- glass highlight -->
  <path d="M392 250 q120 -34 216 24 q-150 -6 -216 40 z" fill="#ffffff" opacity="0.07"/>
</svg>
